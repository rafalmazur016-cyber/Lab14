version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_server
    ports:
      - "4001:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      - php

  php:
    image: php:8.2-fpm-alpine
    container_name: php_fpm_server
    volumes:
      - ./src:/var/www/html
    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql_server
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin_server
    ports:
      - "6001:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - frontend
      - backend
    depends_on:
      - mysql

networks:
  frontend:
  backend:

volumes:
  mysql_data:
